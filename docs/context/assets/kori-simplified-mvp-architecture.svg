<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 42px Arial, sans-serif; fill: #101936; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 22px Arial, sans-serif; fill: #101936; }
      .label { font: 700 20px Arial, sans-serif; fill: #101936; }
      .text { font: 400 16px Arial, sans-serif; fill: #374151; }
      .box-blue { fill: #f8fbff; stroke: #274c77; stroke-width: 2; rx: 14; }
      .box-green { fill: #f7fbf8; stroke: #2f6f5e; stroke-width: 2; rx: 14; }
      .box-gold { fill: #ffffff; stroke: #d7b65d; stroke-width: 2; rx: 14; }
      .box-red { fill: #fff8f6; stroke: #b45309; stroke-width: 2; rx: 14; }
      .pill { fill: #101936; rx: 14; }
      .pill-text { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #101936; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #6b7280; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowhead-gray); }
      .note { fill: #fffdf7; stroke: #ead8a5; stroke-width: 1.5; rx: 12; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#101936"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="title" x="70" y="70">Kori - Simplified Buildathon MVP Architecture</text>
  <text class="subtitle" x="70" y="105">Non-production demo: no real capital, no real securities, no real KYC/AML, no custody.</text>

  <rect class="box-blue" x="70" y="155" width="220" height="160"/>
  <text class="label" x="95" y="195">1. Kori App</text>
  <text class="text" x="95" y="228">Landing + demo flow</text>
  <text class="text" x="95" y="255">Connects wallet</text>
  <text class="text" x="95" y="282">Shows default deal</text>

  <rect class="box-blue" x="330" y="155" width="220" height="160"/>
  <text class="label" x="355" y="195">2. Investor</text>
  <text class="text" x="355" y="228">Selects profile</text>
  <text class="text" x="355" y="255">Approves MockUSDC</text>
  <text class="text" x="355" y="282">Deposits test funds</text>

  <rect class="box-blue" x="590" y="155" width="220" height="160"/>
  <text class="label" x="615" y="195">3. Default Deal</text>
  <text class="text" x="615" y="228">One demo SPV/deal</text>
  <text class="text" x="615" y="255">One startup</text>
  <text class="text" x="615" y="282">One milestone</text>

  <rect class="box-green" x="850" y="155" width="220" height="160"/>
  <text class="label" x="875" y="195">4. Escrow</text>
  <text class="text" x="875" y="228">Sepolia testnet</text>
  <text class="text" x="875" y="255">MockUSDC locked</text>
  <text class="text" x="875" y="282">KoriEscrow rules</text>

  <rect class="box-blue" x="1110" y="155" width="220" height="160"/>
  <text class="label" x="1135" y="195">5. Startup</text>
  <text class="text" x="1135" y="228">Submits milestone</text>
  <text class="text" x="1135" y="255">Uploads evidence</text>
  <text class="text" x="1135" y="282">Waits for decision</text>

  <rect class="box-green" x="1370" y="155" width="160" height="160"/>
  <text class="label" x="1395" y="195">6. Payout</text>
  <text class="text" x="1395" y="228">Escrow pays</text>
  <text class="text" x="1395" y="255">Startup receives</text>
  <text class="text" x="1395" y="282">MockUSDC only</text>

  <path class="arrow" d="M290 235 H320"/>
  <path class="arrow" d="M550 235 H580"/>
  <path class="arrow" d="M810 235 H840"/>
  <path class="arrow" d="M1070 235 H1100"/>
  <path class="arrow" d="M1330 235 H1360"/>

  <rect class="box-gold" x="225" y="395" width="330" height="190"/>
  <text class="section" x="250" y="435">AI Evidence Reviewer</text>
  <text class="text" x="250" y="470">Reads milestone criteria</text>
  <text class="text" x="250" y="497">Reads submitted evidence</text>
  <text class="text" x="250" y="524">Recommends approve / reject / ask</text>
  <rect class="pill" x="250" y="545" width="250" height="30"/>
  <text class="pill-text" x="270" y="566">Cannot sign or release funds</text>

  <rect class="box-gold" x="635" y="395" width="330" height="190"/>
  <text class="section" x="660" y="435">Human Verifier</text>
  <text class="text" x="660" y="470">Reviews AI output</text>
  <text class="text" x="660" y="497">Approves milestone</text>
  <text class="text" x="660" y="524">Calls setMilestone(true)</text>
  <rect class="pill" x="660" y="545" width="240" height="30"/>
  <text class="pill-text" x="682" y="566">Decision stays human</text>

  <rect class="box-gold" x="1045" y="395" width="330" height="190"/>
  <text class="section" x="1070" y="435">Safe Multisig</text>
  <text class="text" x="1070" y="470">2-of-3 demo signers</text>
  <text class="text" x="1070" y="497">Approves release()</text>
  <text class="text" x="1070" y="524">Only authorized caller</text>
  <rect class="pill" x="1070" y="545" width="250" height="30"/>
  <text class="pill-text" x="1094" y="566">Governance before payout</text>

  <path class="dash" d="M1220 315 V385"/>
  <path class="dash" d="M960 315 V385"/>
  <path class="dash" d="M440 315 V385"/>
  <path class="arrow" d="M555 490 H625"/>
  <path class="arrow" d="M965 490 H1035"/>
  <path class="arrow" d="M1210 395 C1210 350 960 360 960 325"/>
  <path class="arrow" d="M1070 235 C1180 335 1360 335 1450 315"/>

  <rect class="note" x="70" y="690" width="700" height="210"/>
  <text class="section" x="100" y="730">Demo Scope</text>
  <text class="text" x="100" y="765">- One demo deal, one milestone, one full release</text>
  <text class="text" x="100" y="792">- MockUSDC on Sepolia, no real USD or real USDC</text>
  <text class="text" x="100" y="819">- AI is advisory; human and Safe control irreversible actions</text>
  <text class="text" x="100" y="846">- Off-chain database stores evidence and app state</text>
  <text class="text" x="100" y="873">- On-chain contract stores only minimal deterministic state</text>

  <rect class="box-red" x="830" y="690" width="700" height="210"/>
  <text class="section" x="860" y="730">Post-MVP / Legal Workstream</text>
  <text class="text" x="860" y="765">- Legal product and SPV structure</text>
  <text class="text" x="860" y="792">- KYC/KYB, AML, investor qualification</text>
  <text class="text" x="860" y="819">- Custody, fiat accounts, on/off-ramp providers</text>
  <text class="text" x="860" y="846">- Authoritative off-chain ownership ledger</text>
  <text class="text" x="860" y="873">- Disputes, refunds, disclosures, audited contracts</text>
</svg>
