name: KORI-MVP-CI

on:
  pull_request:
    branches:
      - develop
      - feature/nbrand
      - main

  push:
    branches:
      - develop
      - feature/nbrand
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  soroban:
    name: Soroban
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: packages/stellar-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install 1.91.1 \
            --profile minimal \
            --component rustfmt,clippy \
            --target wasm32v1-none
          rustup default 1.91.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test contract
        run: cargo test --locked

      - name: Lint contract
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build contract Wasm
        run: cargo build --locked --target wasm32v1-none --release
